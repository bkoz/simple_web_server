apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: simplewebserver
  labels:
    app: simplewebserver
    app.kubernetes.io/name: simplewebserver
    app.kubernetes.io/component: frontend
spec:
  to:
    kind: Service
    name: simplewebserver
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
