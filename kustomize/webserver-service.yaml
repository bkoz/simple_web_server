apiVersion: v1
kind: Service
metadata:
  name: simplewebserver
  labels:
    app: simplewebserver
    app.kubernetes.io/name: simplewebserver
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: simplewebserver
